name: lead-response-desk

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: lead_desk
      POSTGRES_USER: lead_desk_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-lead_desk_owner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-lead_desk_app}
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_desk_owner -d lead_desk"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["sh", "-c", "npm run db:migrate && npm run db:bootstrap"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lead_desk_owner:${POSTGRES_OWNER_PASSWORD:-lead_desk_owner}@postgres:5432/lead_desk
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      DATABASE_URL: postgres://lead_desk_app:${POSTGRES_APP_PASSWORD:-lead_desk_app}@postgres:5432/lead_desk
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://lead_desk_app:${POSTGRES_APP_PASSWORD:-lead_desk_app}@postgres:5432/lead_desk
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
