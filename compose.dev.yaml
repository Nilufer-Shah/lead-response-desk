services:
  postgres:
    ports:
      - "5432:5432"
  web:
    build: null
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
  worker:
    build: null
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["npm", "run", "dev:worker"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
